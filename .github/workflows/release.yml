name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

# Read-only for every job that builds or runs a third-party action. Only
# `publish` re-grants write, so a compromised build dependency holds a token
# that cannot create or alter a release.
permissions:
  contents: read

jobs:
  validate:
    name: Validate release commit
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve release commit
        id: release-commit
        run: echo "sha=$(git rev-parse "${GITHUB_SHA}^{commit}")" >> "$GITHUB_OUTPUT"

      - name: Verify release commit is on main
        env:
          RELEASE_SHA: ${{ steps.release-commit.outputs.sha }}
        run: |
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "$RELEASE_SHA" refs/remotes/origin/main; then
            echo "::error::${RELEASE_SHA} is not on main. Tag a commit that has been merged."
            exit 1
          fi

      - name: Verify CI passed on main for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release-commit.outputs.sha }}
        run: |
          count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&head_sha=${RELEASE_SHA}" -q '.total_count')
          if [ "$count" -lt 1 ]; then
            echo "::error::No successful main CI run for ${RELEASE_SHA}. Wait for CI on main to pass, then re-tag."
            exit 1
          fi

  build:
    name: Build release fonts
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install FontForge + 7-Zip
        run: |
          sudo apt-get update
          sudo apt-get install -y fontforge python3-fontforge p7zip-full

      - name: Create venv + install Python deps
        run: |
          /usr/bin/python3 -m venv --system-site-packages venv
          venv/bin/pip install --quiet -r requirements.txt

      - name: Restore upstream sources
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sources
          key: sources-${{ hashFiles('versions.env') }}

      - name: Build and verify all fonts
        run: ./scripts/build-all.sh

      - name: Package release assets
        run: ./scripts/package-release.sh "${{ github.ref_name }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build]
    # The single write boundary of the release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist

      - name: Verify checksums
        run: cd dist && sha256sum --check --strict SHA256SUMS.txt

      - name: Generate release notes
        run: |
          python3 -m venv venv
          venv/bin/pip install --quiet pyyaml
          source venv/bin/activate
          ./scripts/release-notes.sh "${{ github.ref_name }}" dist > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: Rec Mountain Fonts ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: dist/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
