# Rec Mono St.Helens — casual, cursive Recursive for coding
#
# Rec Sans Mt.Baker (mt-baker.yaml) extends this file, so changes here apply
# to both families. Rec Serif Mt.Adams (mt-adams.yaml) is separate.

Family Name: Rec Mono St.Helens

# true: monospace (MONO 1). false: proportional (MONO 0).
Mono: true

# Axis values per style. See https://recursive.design
#   CASL  0 = Linear, 1 = Casual
#   wght  300–1000
#   slnt  0 to -15 (degrees of slant; more negative = more slanted)
#   CRSV  0 = Roman, 1 = Cursive
Styles:
  Regular:     { CASL: 1, wght: 400, slnt: -3,  CRSV: 1 }
  Italic:      { CASL: 1, wght: 400, slnt: -10, CRSV: 1 }
  Bold:        { CASL: 1, wght: 600, slnt: -3,  CRSV: 1 }
  Bold Italic: { CASL: 1, wght: 600, slnt: -10, CRSV: 1 }

# Turn code ligatures (=>, !=, ...) on by default. Applied to mono families only.
Code Ligatures: true

# Stylistic sets to freeze in. ss01–ss06 only change Roman (CRSV 0) glyphs.
Features:
  - ss01  # Single-story a
  - ss02  # Single-story g
  - ss03  # Simplified f
  - ss04  # Simplified i
  - ss05  # Simplified l
  - ss06  # Simplified r
  - ss07  # Simplified italic diagonals (kwxyz)
  - ss08  # Serifless L and Z
  - ss09  # Simplified 6 and 9
  - ss10  # Dotted 0
  - ss11  # Simplified 1
  - ss12  # Simplified @
